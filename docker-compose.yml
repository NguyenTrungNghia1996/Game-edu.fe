services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: https://game-edu-api.nghia196.qzz.io/api/v1
        NUXT_PUBLIC_ASSET_CDN_URL: https://cdn.nghia196.qzz.io
    container_name: edugame-fe
    restart: unless-stopped
    ports:
      - "3000:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
