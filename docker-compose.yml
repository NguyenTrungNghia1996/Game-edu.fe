services:
  fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL:-http://localhost:8080/api/v1}
        NUXT_PUBLIC_ASSET_CDN_URL: ${NUXT_PUBLIC_ASSET_CDN_URL:-https://assets.yourdomain.com}
    container_name: edugame-fe
    restart: unless-stopped
    ports:
      - "${FE_PORT:-3000}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
